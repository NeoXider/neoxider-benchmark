<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neoxider-benchmark — form task</title>
<style>
  :root { color-scheme: dark; }
  body { background:#0f1115; color:#e6e6e6; font:15px/1.5 system-ui, sans-serif;
         margin:0; padding:32px 20px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8b93a1; font-size:13px; margin-bottom:24px; }
  label { display:block; margin:16px 0 6px; font-weight:600; font-size:13px; }
  input[type=text], input[type=email], input[type=number], input[type=date],
  select, textarea {
    width:100%; box-sizing:border-box; background:#171a21; color:#e6e6e6;
    border:1px solid #2a2f3a; border-radius:6px; padding:9px 11px; font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .row label { margin:0; font-weight:400; }
  button { margin-top:24px; background:#3b82f6; color:#fff; border:0; border-radius:6px;
           padding:11px 22px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:#2f6fd8; }

  /* Вкладки */
  .tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .tab { background:#171a21; color:#8b93a1; border:1px solid #2a2f3a; border-radius:6px;
         padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; margin:0; }
  .tab.active { color:#e6e6e6; border-color:#3b82f6; background:#12203a; }
  .tabpanel { border:1px solid #2a2f3a; border-radius:6px; padding:12px; }
  .tabpanel label { margin-top:0; }
  /* Перетаскиваемый список */
  #sortable { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  #sortable li { background:#171a21; border:1px solid #2a2f3a; border-radius:6px;
                 padding:10px 14px; cursor:grab; user-select:none; }
  #sortable li.dragging { opacity:.55; cursor:grabbing; border-color:#3b82f6; }
  .hidden { display:none; }
  #result { margin-top:24px; padding:16px; border-radius:8px; }
  #result.ok { background:#0f2a1a; border:1px solid #1f6b3f; }
  #result.err { background:#2a1414; border:1px solid #6b2020; }
  code { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:20px;
         letter-spacing:2px; }
  .note { color:#8b93a1; font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Benchmark form</h1>
  <div class="sub">Level <span id="lvl">1</span>. Fill the fields with the values from the
    assignment and press Submit — the page will show a confirmation code.</div>

  <form id="f" autocomplete="off">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name">

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <div data-min="2" class="fld">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1" max="999">
    </div>

    <div data-min="3" class="fld">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">—</option>
        <option>Armenia</option><option>Cyprus</option><option>Georgia</option>
        <option>Kazakhstan</option><option>Portugal</option><option>Serbia</option>
      </select>
    </div>

    <div data-min="4" class="fld">
      <label>Plan</label>
      <div class="row">
        <label><input type="radio" name="plan" value="basic"> basic</label>
        <label><input type="radio" name="plan" value="pro"> pro</label>
        <label><input type="radio" name="plan" value="team"> team</label>
      </div>
    </div>

    <div data-min="5" class="fld">
      <label>Newsletter</label>
      <div class="row">
        <label><input type="checkbox" id="newsletter"> subscribe</label>
      </div>
    </div>

    <div data-min="6" class="fld">
      <label for="comment">Comment</label>
      <textarea id="comment" name="comment"></textarea>
    </div>

    <div data-min="7" class="fld hidden" id="freqWrap">
      <label for="frequency">Frequency</label>
      <select id="frequency" name="frequency">
        <option value="">—</option>
        <option>daily</option><option>weekly</option><option>monthly</option>
      </select>
      <div class="note">Only shows up once Newsletter is checked.</div>
    </div>

    <div data-min="8" class="fld">
      <label for="startdate">Start date</label>
      <input type="date" id="startdate" name="startdate">
    </div>

    <div data-min="9" class="fld">
      <label>Topics</label>
      <div class="row">
        <label><input type="checkbox" class="topic" value="ai"> ai</label>
        <label><input type="checkbox" class="topic" value="dotnet"> dotnet</label>
        <label><input type="checkbox" class="topic" value="python"> python</label>
        <label><input type="checkbox" class="topic" value="unity"> unity</label>
      </div>
    </div>

    <div data-min="10" class="fld">
      <label for="priority">Priority: <span id="prioVal">5</span></label>
      <input type="range" id="priority" min="1" max="10" value="5" style="width:100%">
    </div>

    <!-- Вкладки: часть полей не видна, пока по вкладке не кликнули. Проверяет,
         что агент осматривает страницу, а не заполняет по памяти о разметке. -->
    <div data-min="8" class="fld">
      <label>Details</label>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="general" role="tab">General</button>
        <button type="button" class="tab" data-tab="billing" role="tab">Billing</button>
        <button type="button" class="tab" data-tab="access" role="tab">Access</button>
      </div>
      <div class="tabpanel" data-panel="general">
        <div class="note">Nothing to fill in here.</div>
      </div>
      <div class="tabpanel hidden" data-panel="billing">
        <label for="invoice">Invoice number</label>
        <input type="text" id="invoice" name="invoice" disabled>
      </div>
      <div class="tabpanel hidden" data-panel="access">
        <label for="seats">Seats</label>
        <input type="number" id="seats" name="seats" min="1" max="99" disabled>
      </div>
    </div>

    <!-- Перетаскивание. Реализовано на pointer-событиях, а не на HTML5
         drag-and-drop: синтетический drag браузерной автоматизации по HTML5 API
         обычно не проходит, а mousedown/mousemove/mouseup работает везде. -->
    <div data-min="9" class="fld">
      <label>Priority order — drag the items into the required order</label>
      <ul id="sortable">
        <li data-key="alpha">alpha</li>
        <li data-key="beta">beta</li>
        <li data-key="gamma">gamma</li>
        <li data-key="delta">delta</li>
      </ul>
      <div class="note">Current order: <span id="orderNow">alpha,beta,gamma,delta</span></div>
    </div>

    <button type="submit">Submit</button>
  </form>

  <div id="result" class="hidden"></div>
</div>

<script>
// Уровень берётся из ?level=N. Поля выше нужного уровня скрываются, чтобы
// агент не отвлекался на лишнее.
var level = Math.max(1, Math.min(10, parseInt(
  new URLSearchParams(location.search).get('level') || '1', 10) || 1));
document.getElementById('lvl').textContent = level;

document.querySelectorAll('.fld').forEach(function (el) {
  if (parseInt(el.dataset.min, 10) > level) el.remove();
});

// Frequency показывается только при включённом Newsletter — проверка того,
// что агент реально взаимодействует со страницей, а не шлёт значения вслепую.
var nl = document.getElementById('newsletter');
if (nl) nl.addEventListener('change', function () {
  var w = document.getElementById('freqWrap');
  if (w) w.classList.toggle('hidden', !nl.checked);
});

var prio = document.getElementById('priority');
if (prio) prio.addEventListener('input', function () {
  document.getElementById('prioVal').textContent = prio.value;
});

// --- вкладки ---------------------------------------------------------------
document.querySelectorAll('.tab').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    document.querySelectorAll('.tabpanel').forEach(function (p) {
      var active = p.dataset.panel === btn.dataset.tab;
      p.classList.toggle('hidden', !active);
      // Поля скрытых вкладок ОТКЛЮЧЕНЫ, а не просто спрятаны css-классом.
      // Иначе значение можно было выставить прямо в DOM, ни разу не кликнув
      // по вкладке, — и задача проверяла бы не работу с интерфейсом, а умение
      // писать в document.
      p.querySelectorAll('input, select, textarea').forEach(function (f) {
        if (active) { f.removeAttribute('disabled'); }
        else { f.setAttribute('disabled', 'disabled'); }
      });
    });
  });
});

// --- перетаскивание --------------------------------------------------------
// Порядок меняется по pointer-событиям: элемент, который тащат, вставляется
// перед тем, над чьей верхней половиной находится курсор.
(function () {
  var list = document.getElementById('sortable');
  if (!list) return;
  var dragging = null;
  // Счётчик настоящих перетаскиваний. Порядок в DOM подделывается одной
  // строкой appendChild, поэтому итог засчитывается только при реальных
  // pointer-событиях: иначе задача мерила бы не работу с интерфейсом.
  window.__dragCount = 0;

  function refresh() {
    var out = [].slice.call(list.children).map(function (li) { return li.dataset.key; });
    var box = document.getElementById('orderNow');
    if (box) box.textContent = out.join(',');
  }

  list.addEventListener('mousedown', function (e) {
    var li = e.target.closest('li');
    if (!li) return;
    dragging = li;
    li.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var over = document.elementFromPoint(e.clientX, e.clientY);
    over = over && over.closest ? over.closest('#sortable li') : null;
    if (!over || over === dragging) return;
    var r = over.getBoundingClientRect();
    var before = e.clientY < r.top + r.height / 2;
    list.insertBefore(dragging, before ? over : over.nextSibling);
    refresh();
  });

  document.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging.classList.remove('dragging');
    dragging = null;
    window.__dragCount += 1;
    refresh();
  });

  refresh();
})();

// FNV-1a 32 бита. Тот же алгоритм в bench/tasks/t3_webform.py.
function fnv1a(str) {
  var bytes = new TextEncoder().encode(str);
  var h = 0x811C9DC5;
  for (var i = 0; i < bytes.length; i++) {
    h ^= bytes[i];
    // Math.imul обязателен: обычное умножение уводит результат за 2^53
    // и теряет младшие биты, из-за чего код разошёлся бы с эталоном на Python.
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('0000000' + h.toString(16).toUpperCase()).slice(-8);
}

var ORDER = ['name','email','quantity','country','plan','newsletter',
             'comment','frequency','startdate','invoice','seats','topics','order','priority'];

// Значение вкладочного поля запоминается В МОМЕНТ ВВОДА, пока его вкладка
// активна, и потом уже не зависит от того, какая вкладка открыта.
//
// Раньше collect() обнулял любое поле на скрытой вкладке — и задача с восьмого
// уровня становилась НЕПРОХОДИМОЙ: invoice живёт на Billing, seats на Access,
// активной может быть только одна, значит одно из двух обязательных полей
// всегда читалось пустым. Две модели написали об этом прямым текстом и
// получили ноль за честный отчёт, а прошли уровень те, кто обошёл интерфейс.
// Замысел «нельзя вписать значение, ни разу не открыв вкладку» сохранён:
// коммит происходит только при событии ввода на включённом видимом поле.
var committed = {};
['invoice', 'seats'].forEach(function (id) {
  var e = document.getElementById(id);
  if (!e) return;
  e.addEventListener('input', function () {
    if (e.disabled || (e.closest && e.closest('.tabpanel.hidden'))) return;
    committed[id] = e.value.trim();
  });
});

function collect() {
  var v = {};
  // Отключённое поле читается как пустое. Атрибут disabled мешает человеку,
  // но не скрипту: значение в него записывается свободно, поэтому проверять
  // надо здесь, при сборе, а не надеяться на браузер.
  var g = function (id) {
    var e = document.getElementById(id);
    if (!e) return null;
    if (Object.prototype.hasOwnProperty.call(committed, id)) return committed[id];
    if (e.disabled || (e.closest && e.closest('.tabpanel.hidden'))) return '';
    return e.value.trim();
  };
  v.name = g('name');
  v.email = g('email');
  if (level >= 2) v.quantity = g('quantity');
  if (level >= 3) v.country = g('country');
  if (level >= 4) {
    var p = document.querySelector('input[name=plan]:checked');
    v.plan = p ? p.value : '';
  }
  if (level >= 5) v.newsletter = document.getElementById('newsletter').checked ? 'yes' : 'no';
  if (level >= 6) v.comment = g('comment');
  if (level >= 7) v.frequency = g('frequency');
  if (level >= 8) { v.startdate = g('startdate'); v.invoice = g('invoice'); v.seats = g('seats'); }
  if (level >= 9) {
    var t = [].slice.call(document.querySelectorAll('.topic:checked')).map(function (c) { return c.value; });
    v.topics = t.sort().join(',');
  }
  if (level >= 9) {
    var li = [].slice.call(document.querySelectorAll('#sortable li'));
    v.order = (window.__dragCount > 0)
      ? li.map(function (x) { return x.dataset.key; }).join(',')
      : 'NOT-DRAGGED';
  }
  if (level >= 10) v.priority = g('priority');
  return v;
}

document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = collect();
  var box = document.getElementById('result');
  box.classList.remove('hidden', 'ok', 'err');

  var empty = ORDER.filter(function (k) {
    return v[k] !== undefined && v[k] !== null && v[k] === '';
  });
  if (empty.length) {
    box.classList.add('err');
    box.innerHTML = '<b>Not filled in:</b> ' + empty.join(', ');
    return;
  }

  var parts = ORDER.filter(function (k) { return v[k] !== undefined && v[k] !== null; })
                   .map(function (k) { return k + '=' + v[k]; });
  var code = fnv1a('L' + level + '|' + parts.join('|'));
  box.classList.add('ok');
  box.innerHTML = '<div>Confirmation code</div><code id="code">' + code + '</code>' +
                  '<div class="note">Return the line: CODE: ' + code + '</div>';
});
</script>
</body>
</html>
